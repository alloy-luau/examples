name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples:
    name: Build every example with the current compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
      - uses: actions/checkout@v4
        with:
          repository: alloy-luau/alloy
          path: crates
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Compile, lint, and hold to the formatter
        working-directory: crates
        run: |
          cargo run -q -- check
          cargo run -q -- fmt --check ../examples
